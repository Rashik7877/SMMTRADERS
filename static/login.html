<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · SM MOIDEEN TRADERS</title>
<link rel="stylesheet" href="/static/css/style.css?v=4">
<style>
  body.auth-body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 32px 28px;
  }
  .auth-brand h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: .4px;
  }
  .auth-brand p {
    margin: 4px 0 22px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .auth-error {
    display: none;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: var(--radius-xs);
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #FECACA;
    font-size: 13px;
    line-height: 1.4;
  }
  .auth-field { margin-bottom: 16px; }
  .auth-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .auth-input-wrap { position: relative; }
  .auth-input-wrap input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 48px 12px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    background: #fff;
    color: var(--text);
    transition: var(--transition);
  }
  .auth-input-wrap input:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
    border-color: var(--primary);
  }
  .auth-toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    font-size: 12px;
    font-weight: 700;
    border-radius: var(--radius-xs);
  }
  .auth-toggle:hover { color: var(--primary); }
  .auth-btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: var(--radius-sm);
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 4px;
  }
  .auth-btn:hover:not(:disabled) { background: var(--primary-light); }
  .auth-btn:disabled { opacity: .65; cursor: not-allowed; }
  .auth-hint {
    margin: 18px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
  }
  @media (max-width: 420px) {
    .auth-card { padding: 26px 18px; }
  }
</style>
</head>
<body class="auth-body">
<main class="auth-card" role="main">
  <div class="auth-brand">
    <h1>SM MOIDEEN TRADERS</h1>
    <p>SuperAdmin sign in</p>
  </div>

  <div class="auth-error" id="login-error" role="alert" aria-live="polite"></div>

  <form id="login-form" novalidate>
    <div class="auth-field">
      <label for="login-username">Username</label>
      <div class="auth-input-wrap">
        <input id="login-username" name="username" type="text"
               autocomplete="username" required maxlength="128" autofocus>
      </div>
    </div>

    <div class="auth-field">
      <label for="login-password">Password</label>
      <div class="auth-input-wrap">
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required maxlength="512">
        <button type="button" class="auth-toggle" id="toggle-password"
                aria-label="Show password">Show</button>
      </div>
    </div>

    <button class="auth-btn" id="login-submit" type="submit">Sign in</button>
  </form>

  <p class="auth-hint">Restricted to authorised staff.</p>
</main>

<script>
(function () {
  var form = document.getElementById('login-form');
  var errBox = document.getElementById('login-error');
  var submit = document.getElementById('login-submit');
  var pw = document.getElementById('login-password');

  document.getElementById('toggle-password').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errBox.style.display = 'none';
    var username = document.getElementById('login-username').value.trim();
    var password = pw.value;
    if (!username || !password) {
      showError('Enter your username and password.');
      return;
    }
    submit.disabled = true;
    submit.textContent = 'Signing in\u2026';
    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      if (res.status === 429) {
        showError(data.detail || 'Too many attempts. Please try again later.');
      } else if (res.status === 503) {
        showError(data.detail || 'Sign-in is temporarily unavailable.');
      } else {
        showError(data.detail || 'Sign-in failed.');
      }
    } catch (err) {
      showError('Could not reach the server. Please try again.');
    } finally {
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
